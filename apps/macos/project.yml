name: JianMi
options:
  bundleIdPrefix: com.jianmi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 1

targets:
  JianMi:
    type: application
    platform: macOS
    sources: [JianMi]
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sodium
        product: Sodium
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: MarkdownUI
        product: MarkdownUI
    info:
      path: JianMi/Info.plist
      properties:
        CFBundleDisplayName: 简密
        CFBundleName: JianMi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSFaceIDUsageDescription: 使用触控 ID 解锁您的密码库。
        NSHumanReadableCopyright: © 2025 简密. 本地私用构建.
        CFBundleIconFile: AppIcon
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  JianMiTests:
    type: bundle.unit-test
    platform: macOS
    sources: [JianMiTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JianMi

schemes:
  JianMi:
    build:
      targets:
        JianMi: all
        JianMiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [JianMiTests]
