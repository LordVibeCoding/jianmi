name: JianMi
options:
  bundleIdPrefix: com.jianmi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.9.1

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  JianMi:
    type: application
    platform: macOS
    sources: [JianMi]
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sodium
        product: Sodium
    info:
      path: JianMi/Info.plist
      properties:
        CFBundleDisplayName: 简密
        CFBundleName: JianMi
        LSUIElement: true
        NSAppleEventsUsageDescription: 简密需要读取浏览器当前页面地址，用于快速捕获时自动填写网址。
        NSFaceIDUsageDescription: 使用触控 ID 解锁您的密码库。
        NSHumanReadableCopyright: © 2025 简密. 本地私用构建.

  JianMiTests:
    type: bundle.unit-test
    platform: macOS
    sources: [JianMiTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JianMi

schemes:
  JianMi:
    build:
      targets:
        JianMi: all
        JianMiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [JianMiTests]
