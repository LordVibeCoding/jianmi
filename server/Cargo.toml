[package]
name = "jianmi-server"
version = "0.1.0"
edition = "2021"
description = "简密自托管同步服务端 —— 零知识，只存密文"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
anyhow = "1"

[profile.release]
lto = true
strip = true
opt-level = 3
