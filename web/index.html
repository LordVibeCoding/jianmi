<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>简密 · Web 视图</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1d232c;
    --border: #2d333b; --text: #e6edf3; --dim: #8b949e;
    --accent: #4c7dff; --green: #3fb950; --red: #f85149; --orange: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 36px; width: 380px; max-width: 92vw;
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 14px;
    background: linear-gradient(135deg, #5a8cff, #1f38d9);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    box-shadow: 0 4px 14px rgba(76,125,255,.35);
  }
  h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 13px; text-align: center; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    outline: none; transition: border .15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: default; }
  .error { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }

  /* ── 列表页 ── */
  header {
    position: sticky; top: 0; background: rgba(13,17,23,.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex;
    align-items: center; gap: 12px; z-index: 10;
  }
  header .logo { width: 32px; height: 32px; border-radius: 8px; margin: 0; font-size: 16px; }
  header h2 { font-size: 16px; flex: 0 0 auto; }
  #search {
    flex: 1; max-width: 420px; padding: 8px 12px;
  }
  header .lockbtn {
    width: auto; margin: 0; padding: 8px 14px; background: var(--panel2);
    border: 1px solid var(--border); color: var(--dim); font-weight: 500;
  }
  main { max-width: 760px; margin: 0 auto; padding: 20px; }
  .entry {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: border .15s, transform .1s;
  }
  .entry:hover { border-color: var(--accent); }
  .badge {
    width: 36px; height: 36px; border-radius: 9px; flex: 0 0 36px;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .entry .info { flex: 1; min-width: 0; }
  .entry .title { font-size: 14px; font-weight: 500; }
  .entry .host { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tagchip {
    font-size: 11px; color: var(--dim); background: var(--panel2);
    padding: 2px 8px; border-radius: 99px; margin-left: 4px;
  }
  .empty { text-align: center; color: var(--dim); padding: 60px 0; font-size: 14px; }

  /* ── 详情弹窗 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 460px; max-width: 92vw; max-height: 85vh; overflow-y: auto; padding: 24px;
  }
  .modal h3 { font-size: 18px; margin-bottom: 2px; }
  .modal .mhost { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .field {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
  }
  .field .fl { flex: 1; min-width: 0; }
  .field .k { font-size: 11px; color: var(--dim); }
  .field .v { font-size: 14px; word-break: break-all; font-variant-ligatures: none; }
  .field .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .iconbtn {
    width: auto; margin: 0; padding: 6px 10px; font-size: 12px; font-weight: 500;
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    flex: 0 0 auto;
  }
  .iconbtn.copied { background: var(--green); border-color: var(--green); }
  .notes {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-size: 13px; white-space: pre-wrap; color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-bottom: 10px;
  }
  .closebtn { background: var(--panel2); border: 1px solid var(--border); color: var(--dim); }
  .hint { font-size: 11px; color: var(--dim); text-align: center; margin-top: 14px; }
</style>
</head>
<body>

<div id="app"></div>
<script src="/sodium.js"></script>
<script>
"use strict";
// ═══ 简密 Web 视图 —— 零知识：解密只发生在浏览器内存里 ═══
// 服务器只提供密文；主密码/密钥永不发送到任何地方。

const $app = document.getElementById("app");
let TOKEN = sessionStorage.getItem("jm_token") || "";
let vaultKey = null;        // Uint8Array(32)，仅存内存
let entries = [];           // 解密后的元数据列表

const TYPE_STYLE = {
  login:    ["🔑", "#2f81f7"],
  // 旧版分类（已并入「账号」，保留兼容旧同步数据）
  website:  ["🌐", "#2f81f7"], app: ["📱", "#6e7dfa"], bank_card: ["💳", "#3fb950"],
  wallet:   ["🪙", "#d29922"], ssh: ["🖥", "#a371f7"], identity: ["🪪", "#39c5cf"],
  note:     ["📝", "#e3b341"],
};

// ── 加密原语（与 CryptoEngine.swift 严格对齐）─────────────
// blob = "JM"(2B) | ver(1B) | nonce(24B) | ct+tag
function openBlob(blob, key, aad) {
  if (blob[0] !== 0x4A || blob[1] !== 0x4D || blob[2] !== 1) throw new Error("密文格式无效");
  const nonce = blob.slice(3, 3 + 24);
  const ct = blob.slice(3 + 24);
  return sodium.crypto_aead_xchacha20poly1305_ietf_decrypt(
    null, ct, aad ? sodium.from_string(aad) : null, nonce, key);
}
const b64d = (s) => sodium.from_base64(s, sodium.base64_variants.ORIGINAL);

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Authorization": "Bearer " + TOKEN,
               "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (res.status === 401) throw new Error("访问令牌无效");
  if (!res.ok) throw new Error("服务器错误 " + res.status);
  return res;
}

// ── 解锁流程 ─────────────────────────────────────────────
async function unlock(token, password, setStatus) {
  TOKEN = token;
  setStatus("获取密钥元数据…");
  const meta = await (await api("/api/vault/meta")).json();

  setStatus("派生主密钥（Argon2id）…");
  await new Promise(r => setTimeout(r, 30));   // 让 UI 刷新
  const salt = b64d(meta.kdfSalt);
  const masterKey = sodium.crypto_pwhash(
    32, sodium.from_string(password), salt,
    meta.kdfOpsLimit, meta.kdfMemLimit, sodium.crypto_pwhash_ALG_ARGON2ID13);

  setStatus("解密密码库密钥…");
  try {
    vaultKey = openBlob(b64d(meta.wrappedVaultKey), masterKey, "jianmi.vaultkey.v1");
  } catch (e) {
    throw new Error("主密码错误");
  } finally {
    sodium.memzero(masterKey);
  }

  setStatus("拉取并解密条目…");
  const pull = await (await api("/api/sync/pull", {
    method: "POST", body: JSON.stringify({ since_seq: 0 }),
  })).json();

  entries = [];
  for (const rec of pull.entries) {
    if (rec.deleted) continue;
    try {
      const plain = openBlob(b64d(rec.payload), vaultKey, "sync:" + rec.uuid);
      const p = JSON.parse(sodium.to_string(plain));
      if (p.deletedAt) continue;
      entries.push({ uuid: rec.uuid, ...p });
    } catch (e) { /* 跳过无法解密的记录 */ }
  }
  entries.sort((a, b) => (b.favorite - a.favorite) || (a.title > b.title ? 1 : -1));
  sessionStorage.setItem("jm_token", token);
}

// ── 视图 ─────────────────────────────────────────────────
function loginView() {
  $app.innerHTML = `
  <div class="center"><div class="card">
    <div class="logo">🔑</div>
    <h1>简密</h1>
    <div class="sub">零知识 Web 视图 · 解密只在你的浏览器中进行</div>
    <label>访问令牌</label>
    <input id="token" type="password" value="${TOKEN}" autocomplete="off">
    <label>主密码</label>
    <input id="pwd" type="password" autocomplete="off">
    <button id="go">解锁</button>
    <div class="error" id="err"></div>
  </div></div>`;

  const go = document.getElementById("go");
  const err = document.getElementById("err");
  const submit = async () => {
    go.disabled = true;
    err.textContent = "";
    try {
      await unlock(
        document.getElementById("token").value.trim(),
        document.getElementById("pwd").value,
        (s) => { go.textContent = s; });
      listView();
    } catch (e) {
      err.textContent = e.message;
      go.disabled = false;
      go.textContent = "解锁";
    }
  };
  go.onclick = submit;
  $app.querySelectorAll("input").forEach(i =>
    i.addEventListener("keydown", e => { if (e.key === "Enter") submit(); }));
  document.getElementById(TOKEN ? "pwd" : "token").focus();
}

function listView(query = "") {
  const q = query.toLowerCase();
  const filtered = entries.filter(e =>
    !q || e.title.toLowerCase().includes(q) ||
    (e.urlHost || "").includes(q) ||
    (e.tags || []).some(t => t.toLowerCase().includes(q)));

  $app.innerHTML = `
  <header>
    <div class="logo">🔑</div><h2>简密</h2>
    <input id="search" placeholder="搜索标题、网址、标签…" value="${query.replace(/"/g, "&quot;")}">
    <button class="lockbtn" id="lock">锁定</button>
  </header>
  <main id="list"></main>`;

  const list = document.getElementById("list");
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">${q ? "无匹配结果" : "没有已同步的条目"}</div>`;
  }
  for (const e of filtered) {
    const [icon, color] = TYPE_STYLE[e.type] || ["🔒", "#4c7dff"];
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `
      <div class="badge" style="background:${color}22;border:1px solid ${color}55">${icon}</div>
      <div class="info">
        <div class="title">${esc(e.title)} ${e.favorite ? "⭐" : ""}</div>
        <div class="host">${esc(e.urlHost || "")}</div>
      </div>
      ${(e.tags || []).slice(0, 3).map(t => `<span class="tagchip">${esc(t)}</span>`).join("")}`;
    div.onclick = () => detailView(e);
    list.appendChild(div);
  }

  const search = document.getElementById("search");
  search.oninput = () => {
    const v = search.value;
    // 只重绘列表，保持输入焦点
    listView(v);
    const s2 = document.getElementById("search");
    s2.focus(); s2.setSelectionRange(v.length, v.length);
  };
  document.getElementById("lock").onclick = () => {
    if (vaultKey) sodium.memzero(vaultKey);
    vaultKey = null; entries = [];
    loginView();
  };
}

function detailView(e) {
  let secret = null;
  try {
    const blob = b64d(e.secretBlob);
    secret = JSON.parse(sodium.to_string(openBlob(blob, vaultKey, e.uuid)));
  } catch (_) {
    secret = null;
  }

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const rows = [];
  if (secret) {
    if (secret.username) rows.push(field("账号", secret.username, false));
    if (secret.password) rows.push(field("密码", secret.password, true));
    if (secret.urlFull)  rows.push(field("网址", secret.urlFull, false));
    for (const f of (secret.customFields || [])) {
      rows.push(field(f.label, f.value, f.kind === "hidden"));
    }
  }
  overlay.innerHTML = `
  <div class="modal">
    <h3>${esc(e.title)}</h3>
    <div class="mhost">${esc(e.urlHost || "")}</div>
    ${rows.join("")}
    ${secret && secret.notesMarkdown ? `<div class="notes">${esc(secret.notesMarkdown)}</div>` : ""}
    <button class="closebtn" id="close">关闭</button>
    <div class="hint">复制的内容请及时清理剪贴板 · Web 端为只读视图</div>
  </div>`;
  overlay.onclick = (ev) => { if (ev.target === overlay) overlay.remove(); };
  overlay.querySelector("#close").onclick = () => overlay.remove();

  overlay.querySelectorAll("[data-copy]").forEach(btn => {
    btn.onclick = async () => {
      await navigator.clipboard.writeText(decodeURIComponent(btn.dataset.copy));
      btn.textContent = "已复制";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("copied"); }, 1500);
    };
  });
  overlay.querySelectorAll("[data-reveal]").forEach(btn => {
    btn.onclick = () => {
      const v = btn.parentElement.querySelector(".v");
      const hidden = v.dataset.hidden === "1";
      v.textContent = hidden ? decodeURIComponent(btn.dataset.reveal) : "••••••••••••";
      v.dataset.hidden = hidden ? "0" : "1";
      btn.textContent = hidden ? "隐藏" : "显示";
    };
  });
  document.body.appendChild(overlay);
}

function field(label, value, masked) {
  const enc = encodeURIComponent(value);
  return `<div class="field">
    <div class="fl">
      <div class="k">${esc(label)}</div>
      <div class="v ${masked ? "mono" : ""}" data-hidden="${masked ? 1 : 0}">${masked ? "••••••••••••" : esc(value)}</div>
    </div>
    ${masked ? `<button class="iconbtn" data-reveal="${enc}">显示</button>` : ""}
    <button class="iconbtn" data-copy="${enc}">复制</button>
  </div>`;
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

sodium.ready.then(loginView);
</script>
</body>
</html>
